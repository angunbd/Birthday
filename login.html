<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Welcome - Angun's Birthday Surprise</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Itim&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #fffbeb 0%, #fef3c7 40%, #fde68a 100%);
      --yellow-main: #f59e0b;
      --yellow-soft: #fef08a;
      --pink-soft: #f43f5e;
      --text-dark: #451a03;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: var(--bg-gradient);
      font-family: 'Fredoka', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: var(--text-dark);
      padding: clamp(15px, 4vw, 25px);
    }

    html {
      height: -webkit-fill-available;
    }

    /* Ambient Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Magic Sparkle Trail Canvas */
    #trail-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      pointer-events: none;
    }

    /* Main Container with 3D Perspective */
    .envelope-wrapper {
      z-index: 2;
      width: 100%;
      max-width: 440px;
      perspective: 1000px;
      animation: popIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.6) translateY(50px) rotate(-4deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
      }
    }

    /* 3D Envelope Component */
    .envelope {
      background: rgba(255, 253, 245, 0.92);
      backdrop-filter: blur(12px);
      border-radius: clamp(24px, 6vw, 32px);
      border: 3px solid #fde68a;
      box-shadow: 0 25px 45px -12px rgba(217, 119, 6, 0.28),
                  0 0 0 clamp(4px, 1.5vw, 8px) #ffffff,
                  0 0 30px rgba(251, 191, 36, 0.35);
      padding: clamp(32px, 8vw, 48px) clamp(24px, 6vw, 36px);
      text-align: center;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
    }

    .envelope.opening {
      transform: scale(0.9) translateY(-20px);
      opacity: 0;
    }

    .seal-badge {
      font-size: clamp(3.2rem, 11vw, 4.2rem);
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 6px 12px rgba(245, 158, 11, 0.3));
      animation: heartPulse 1.8s infinite ease-in-out;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .title {
      font-size: clamp(1.9rem, 6.5vw, 2.5rem);
      color: #b45309;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-family: 'Itim', cursive;
      font-size: clamp(1.2rem, 4.2vw, 1.45rem);
      color: #92400e;
      margin-bottom: clamp(26px, 7vw, 36px);
    }

    /* Modern Glassmorphic Button */
    .open-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      border: none;
      padding: clamp(14px, 4vw, 18px);
      border-radius: 30px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.3rem);
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(245, 158, 11, 0.38);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .open-btn:hover, .open-btn:active {
      transform: translateY(-3deg) scale(1.03);
      box-shadow: 0 12px 28px rgba(245, 158, 11, 0.5);
    }

    /* Cute Mascot Character */
    .mascot-container {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      cursor: pointer;
    }

    .speech-bubble {
      background: #ffffff;
      padding: clamp(6px, 1.5vw, 8px) clamp(10px, 2.5vw, 14px);
      border-radius: 18px;
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
      border: 2px solid #fde047;
      color: #78350f;
      font-weight: 600;
      animation: floatBubble 2s infinite ease-in-out;
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .mascot-avatar {
      font-size: clamp(2.2rem, 6.5vw, 3rem);
      transition: transform 0.2s ease;
    }

    .mascot-container:hover .mascot-avatar, .mascot-container:active .mascot-avatar {
      transform: scale(1.2) rotate(8deg);
    }
  </style>
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="bg-canvas"></canvas>
  <!-- Sparkle Wand Trail Canvas -->
  <canvas id="trail-canvas"></canvas>

  <div class="envelope-wrapper">
    <div class="envelope" id="envelopeCard">
      <div class="seal-badge">💌</div>
      <h1 class="title">Birthday Gift From KoKo Na</h1>
      <p class="subtitle">Tap below to open your postcard Na Angun 💛</p>

      <button class="open-btn" onclick="openEnvelope()">
        <span>Open Postcard</span> ✨
      </button>
    </div>
  </div>

  <!-- Cute Mascot Buddy -->
  <div class="mascot-container" id="mascot" onclick="mascotTalk()">
    <div class="speech-bubble" id="speech">Tap to open! 🐾</div>
    <div class="mascot-avatar">🐻</div>
  </div>

  <!-- External Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    /* ================= OPEN ENVELOPE LOGIC ================= */
    function openEnvelope() {
      const envelope = document.getElementById('envelopeCard');
      envelope.classList.add('opening');

      // Trigger multi-stage confetti burst
      confetti({
        particleCount: 70,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#fef08a', '#fbbf24', '#f43f5e', '#ffffff', '#a7f3d0']
      });

      // Redirect to index.html after unboxing animation
      setTimeout(() => {
        window.location.href = "index.html";
      }, 650);
    }

    /* ================= CUTE MASCOT INTERACTION ================= */
    const phrases = [
      "Welcome! 🎉",
      "Tap the button! 💛",
      "Ready for your wish? 🎂",
      "Let's go! ⭐"
    ];
    let phraseIdx = 0;

    function mascotTalk() {
      phraseIdx = (phraseIdx + 1) % phrases.length;
      document.getElementById('speech').innerText = phrases[phraseIdx];
      
      confetti({
        particleCount: 20,
        spread: 45,
        origin: { x: 0.85, y: 0.85 },
        colors: ['#fbbf24', '#f43f5e']
      });
    }

    /* ================= SPARKLE WAND TRAIL EFFECT ================= */
    const trailCanvas = document.getElementById('trail-canvas');
    const tCtx = trailCanvas.getContext('2d');
    let trailParticles = [];

    function resizeTrail() {
      trailCanvas.width = window.innerWidth;
      trailCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeTrail);
    resizeTrail();

    function addTrailParticle(x, y) {
      for (let i = 0; i < 2; i++) {
        trailParticles.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          size: Math.random() * 6 + 2,
          color: Math.random() > 0.5 ? '#f59e0b' : '#f43f5e',
          alpha: 1,
          speedX: (Math.random() - 0.5) * 1.5,
          speedY: (Math.random() - 0.5) * 1.5 - 0.5
        });
      }
    }

    window.addEventListener('mousemove', (e) => addTrailParticle(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        addTrailParticle(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    function animateTrail() {
      tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
      for (let i = 0; i < trailParticles.length; i++) {
        let p = trailParticles[i];
        p.x += p.speedX;
        p.y += p.speedY;
        p.alpha -= 0.025;

        if (p.alpha <= 0) {
          trailParticles.splice(i, 1);
          i--;
          continue;
        }

        tCtx.save();
        tCtx.globalAlpha = p.alpha;
        tCtx.fillStyle = p.color;
        tCtx.beginPath();
        tCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        tCtx.fill();
        tCtx.restore();
      }
      requestAnimationFrame(animateTrail);
    }
    animateTrail();

    /* ================= BACKGROUND CANVAS: FLOATING HEARTS & GRAPES ================= */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const cuteIcons = ['🍇', '💕', '💛', '🍇', '💖', '✨'];

    class CuteFloatingParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height + canvas.height;
        this.icon = cuteIcons[Math.floor(Math.random() * cuteIcons.length)];
        this.fontSize = Math.floor(Math.random() * 12 + 16);
        this.speedY = Math.random() * 0.7 + 0.3;
        this.swaySpeed = Math.random() * 0.02 + 0.01;
        this.swayAngle = Math.random() * Math.PI * 2;
        this.opacity = Math.random() * 0.45 + 0.25;
      }

      update() {
        this.y -= this.speedY;
        this.swayAngle += this.swaySpeed;
        this.x += Math.sin(this.swayAngle) * 0.5;

        if (this.y < -30) this.reset();
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.fontSize}px 'Fredoka', sans-serif`;
        ctx.fillText(this.icon, this.x, this.y);
        ctx.restore();
      }
    }

    for (let i = 0; i < 28; i++) {
      particles.push(new CuteFloatingParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
